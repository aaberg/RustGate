[package]
name = "rustgate"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "rustgate"
description = "Job-scoped LLM proxy (incremental implementation)"

[dependencies]
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
toml = "0.9"
url = { version = "2", features = ["serde"] }
