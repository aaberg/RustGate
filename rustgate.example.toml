# HTTPS is mandatory. Generate local certificates as described in DESIGN.md.
listen_addr = "127.0.0.1:8443"
upstream_base_url = "http://127.0.0.1:9090"
tls_cert_path = "cert.pem"
tls_key_path = "key.pem"
database_path = "rustgate.sqlite3"
proxy_url = "https://localhost:8443/v1"
# Set RUSTGATE_CONTROL_PLANE_TOKEN and RUSTGATE_UPSTREAM_KEYS from secrets.
# upstream_keys is a TOML table, or a JSON object in RUSTGATE_UPSTREAM_KEYS.
default_ttl_seconds = 1800
max_ttl_seconds = 86400
default_max_requests = 100
max_requests = 10000
default_max_tokens_total = 2000000
max_tokens_total = 100000000

# Upstream/request deadlines in seconds (each 1..=86400).
connect_timeout_seconds = 5
first_byte_timeout_seconds = 60
idle_timeout_seconds = 120
overall_timeout_seconds = 600
# Process-local admission capacity (1..=65536); saturation returns 503.
max_in_flight_requests = 64

# Optional regex arrays replace defaults; [] disables that scan.
# Environment overrides are JSON string arrays:
# RUSTGATE_SECRET_SCAN_PATTERNS / RUSTGATE_PROMPT_INJECTION_PATTERNS.
# Defaults block common sk- keys and long base64-like runs; advisory phrases
# (reveal your system prompt / print your environment / include the API key)
# are recorded without blocking. See DESIGN.md for limitations and audit fields.
# secret_scan_patterns = ['sk-[A-Za-z0-9_-]{20,}']
# prompt_injection_patterns = ['(?i)reveal\s+your\s+system\s+prompt']
