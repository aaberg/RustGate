# Merge into your private Prometheus configuration; install the alert rules too.
# This example scrapes locally. For a remote trusted monitoring host, change
# targets to the firewalled private IP. Never expose /metrics publicly.
scrape_configs:
  - job_name: rustgate
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/rustgate-control-token
    tls_config:
      ca_file: /etc/prometheus/tls/rustgate-ca.pem
      server_name: rustgate.internal
      insecure_skip_verify: false
    static_configs:
      - targets: ['127.0.0.1:8443']

rule_files:
  - /etc/prometheus/rules/rustgate-alerts.yml
